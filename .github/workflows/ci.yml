name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck, build and test
        run: npm run check

  desktop:
    name: Desktop startup on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Open a project on Linux
        if: runner.os == 'Linux'
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a npm run test:desktop
      - name: Validate desktop workflows on Linux
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a npm run test:desktop:pending
          xvfb-run -a npm run test:desktop:evolution
      - name: Open a project on macOS or Windows
        if: runner.os != 'Linux'
        run: npm run test:desktop

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Build before Test: the desktop bridge e2e spawns the compiled CLI
      # (dist/cli/gate.js); without dist/ its requests hang until timeout.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
